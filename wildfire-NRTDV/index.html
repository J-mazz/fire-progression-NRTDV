<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>East Evans Creek Fire WASM Renderer</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; color: #eee; }
    #canvas { width: 100%; height: 100%; display: block; }
    #controls { position: fixed; top: 12px; left: 12px; z-index: 10; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <button id="initialize">Initialize WebGL</button>
    <button id="render">Render Frame</button>
  </div>
  <script src="dist/wasm_pipeline.js"></script>
  <script src="dist/client.js"></script>
  <script>
    let renderer = null;

    async function ensureApp() {
      if (!window.initializeApp) {
        throw new Error('TypeScript application entrypoint is not available.');
      }
      return window.initializeApp('manifests/east_evans_creek_visualization.json', window.Module);
    }

    document.getElementById('initialize').addEventListener('click', async () => {
      try {
        const app = await ensureApp();
        renderer = app.renderer;
        console.log('Initialize WebGL: OK');
      } catch (error) {
        console.error('Initialization failed:', error);
      }
    });

    document.getElementById('render').addEventListener('click', () => {
      if (renderer) {
        renderer.render();
      }
    });

    (async function autoLoadManifest() {
      try {
        const app = await ensureApp();
        console.log('Manifest loaded:', app.manifest);
      } catch (err) {
        console.warn('Manifest auto-load failed:', err instanceof Error ? err.message : err);
      }
    })();
  </script>
</body>
</html>
